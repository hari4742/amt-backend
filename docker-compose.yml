version: '3.8'

services:
  # FastAPI Application
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql://postgres:password@db:5432/amt_backend
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-here
      - UPLOAD_DIR=./uploads
    volumes:
      - ./uploads:/app/uploads
      - .:/app
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - amt-network

  # Celery Worker
  worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/amt_backend
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-here
      - UPLOAD_DIR=./uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info
    networks:
      - amt-network

  # Celery Beat (for scheduled tasks)
  beat:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/amt_backend
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-here
    depends_on:
      - db
      - redis
    command: celery -A app.core.celery_app beat --loglevel=info
    networks:
      - amt-network

  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=amt_backend
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - amt-network

  # Redis (for Celery)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - amt-network

  # Flower (Celery monitoring)
  flower:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.core.celery_app flower --port=5555
    networks:
      - amt-network

volumes:
  postgres_data:
  redis_data:

networks:
  amt-network:
    driver: bridge 